name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Check syntax
        run: node --check server.js

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/demo-app:latest
  deploy:
    needs: build-and-test
    runs-on: self-hosted

    steps:
      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/demo-app:latest

      - name: Stop old container
        run: docker stop demo-container || true

      - name: Remove old container
        run: docker rm demo-container || true

      - name: Run new container
        run: |
          docker run -d -p 3000:3000 --name demo-container \
          ${{ secrets.DOCKERHUB_USERNAME }}/demo-app:latest
